# field.storage.media.field_asset_status
#
# Lifecycle state — the "live" value is what AssetSnapshotBuilder filters
# on when picking which asset wins for a given (atmosphere, slot) cell.
# Allowed values match world_signature's existing asset_status taxonomy
# terms so R5b's migration is a flat mapping.

langcode: en
status: true
dependencies:
  module:
    - media
    - options
id: media.field_asset_status
field_name: field_asset_status
entity_type: media
type: list_string
settings:
  allowed_values:
    - value: live
      label: 'Live'
    - value: draft
      label: 'Draft'
    - value: archived
      label: 'Archived'
  allowed_values_function: ''
module: options
locked: false
cardinality: 1
translatable: false
indexes: {  }
persist_with_no_fields: false
custom_storage: false
