# field.storage.media.field_asset_atmospheres
#
# Which atmospheres use this asset (e.g. "forest", "inner-mind",
# "ue5_meta"). Multi-valued — one asset can serve N atmospheres.
# AssetSnapshotBuilder reads this to enforce the "one live asset per
# (atmosphere, slot) cell" invariant. Empty = "wired everywhere"
# (atmosphere-agnostic).

langcode: en
status: true
dependencies:
  module:
    - media
    - options
id: media.field_asset_atmospheres
field_name: field_asset_atmospheres
entity_type: media
type: list_string
settings:
  allowed_values:
    - value: forest
      label: 'Forest'
    - value: inner-mind
      label: 'Inner mind'
    - value: ue5_meta
      label: 'UE5 meta (blockout)'
  allowed_values_function: ''
module: options
locked: false
cardinality: -1
translatable: false
indexes: {  }
persist_with_no_fields: false
custom_storage: false
