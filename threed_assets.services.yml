services:
  logger.channel.threed_assets:
    parent: logger.channel_base
    arguments: ['threed_assets']

  Drupal\threed_assets\Manifest\GltfManifestExtractor:
    arguments: ['@logger.channel.threed_assets']

  Drupal\threed_assets\AssetResolver:
    arguments: ['@file_url_generator']

  Drupal\threed_assets\AssetIngestor:
    arguments:
      - '@entity_type.manager'
      - '@file_system'
      - '@Drupal\threed_assets\Manifest\GltfManifestExtractor'
